name: CI Pipeline

on:
  push:
    branches: [ "main", "deploy-ready", "fix/**", "feat/**" ]
  pull_request:
    branches: [ "main", "deploy-ready" ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Tests
        env:
          QDRANT_URL: ""
          QDRANT_API_KEY: ""
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          DEEPSEEK_API_KEY: ""
        run: |
          pytest tests/test_chat_state.py tests/test_improvements.py -v
