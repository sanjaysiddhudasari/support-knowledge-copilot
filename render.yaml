services:
  - type: web
    name: support-knowledge-copilot-api
    runtime: python
    plan: 1c-2g
    branch: deploy-ready
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: RETRIEVAL_STRATEGY
        value: hybrid
      # Observability. Stays off until LANGSMITH_TRACING is set to "true" and
      # LANGSMITH_API_KEY is provided; the app runs normally either way.
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: support-knowledge-copilot
      - key: LANGSMITH_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
